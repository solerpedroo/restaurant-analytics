version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: restaurant-analytics-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password_2024
      MYSQL_DATABASE: challenge_db
      MYSQL_USER: challenge
      MYSQL_PASSWORD: challenge_2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "challenge", "-pchallenge_2024"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - analytics-network

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: restaurant-analytics-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: challenge
      DB_PASSWORD: challenge_2024
      DB_NAME: challenge_db
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - analytics-network
    restart: unless-stopped

  # Frontend (Nginx serving static HTML)
  frontend:
    image: nginx:alpine
    container_name: restaurant-analytics-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - analytics-network
    restart: unless-stopped

  # Data Generator (run with --profile tools)
  data-generator:
    build:
      context: .
      dockerfile: Dockerfile.generator
    container_name: restaurant-analytics-data-gen
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: challenge
      DB_PASSWORD: challenge_2024
      DB_NAME: challenge_db
    command: >
      sh -c "
        echo '⏳ Aguardando MySQL estar pronto...' &&
        sleep 10 &&
        echo '🎲 Gerando dados do challenge...' &&
        python generate_data.py \
          --host mysql \
          --user challenge \
          --password challenge_2024 \
          --database challenge_db \
          --stores 50 \
          --products 500 \
          --items 200 \
          --customers 10000 \
          --months 6 &&
        echo '✅ Geração de dados completa!'
      "
    profiles:
      - tools
    networks:
      - analytics-network

  # PHPMyAdmin (opcional, para visualizar banco)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: restaurant-analytics-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: challenge
      PMA_PASSWORD: challenge_2024
    ports:
      - "8080:80"
    depends_on:
      - mysql
    profiles:
      - tools
    networks:
      - analytics-network

volumes:
  mysql_data:
    driver: local

networks:
  analytics-network:
    driver: bridge